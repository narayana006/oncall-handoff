[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oncall-handoff"
version = "0.1.0"
description = "Summarize an on-call shift from pages, chat threads and tickets into a clear handoff note."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
oncall-handoff = "oncall_handoff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
